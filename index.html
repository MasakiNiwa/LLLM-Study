<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="自分のペースで使えるローカルLLMタイプの学習アプリ。記憶のアルゴリズム（FSRS）で復習を管理し、ブラウザ内で動く AI がパートナーになります。"
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>LLLM Study</title>
    <script>
      // 初回描画前にテーマを適用してちらつきを防ぐ
      try {
        var s = JSON.parse(localStorage.getItem('lllm-study:settings') || '{}').state || {};
        var t = s.theme || 'system';
        if (
          t === 'dark' ||
          (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
